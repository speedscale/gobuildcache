name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Required for OIDC federation with azure/login (recommended, keyless auth).
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        # Use our own cache, obviously.
        cache: false
    - name: Install gobuildcache
      run: go install github.com/richardartoul/gobuildcache@latest
    # Recommended: authenticate via Microsoft Entra ID (managed identity /
    # service principal) using OIDC federation — no long-lived account key.
    # gobuildcache then picks this up through DefaultAzureCredential.
    - name: Azure login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Run short tests
      env:
        GOBUILDCACHE_BACKEND_TYPE: azblob
        GOBUILDCACHE_AZBLOB_CONTAINER: ${{ secrets.AZBLOB_CONTAINER }}
        GOBUILDCACHE_AZBLOB_PREFIX: go-build-cache/${{ github.repository }}
        # Recommended: DefaultAzureCredential resolves the identity from the
        # azure/login step above. The identity needs the "Storage Blob Data
        # Contributor" role on the container/account.
        GOBUILDCACHE_AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
        # Alternative auth methods (drop the azure/login step and AZURE_ACCOUNT):
        #   - User delegation SAS (preferred SAS variant):
        #       GOBUILDCACHE_AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
        #       GOBUILDCACHE_AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
        #   - Connection string (carries the account key; Microsoft recommends
        #     disallowing Shared Key auth, so prefer the options above):
        #       GOBUILDCACHE_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        GOCACHEPROG: gobuildcache
      run: go test ./...